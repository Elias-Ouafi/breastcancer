name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The extras of pyproject.toml, not a list of our own: `dev` (pytest, ruff) and
      # `data` (pandas, pydicom, openpyxl), on top of the base install (torch, Flask,
      # numpy, Pillow). Deliberately
      # NOT `.[all]`: `collect` pulls the TCIA client, which the test suite does not
      # exercise and which would turn a ~1 minute check into several. torch comes from
      # the CPU index first: the default wheel ships CUDA and is ~2.5 GB, and pip then
      # finds it already satisfied.
      #
      # The extras are exactly the third-party modules the suite imports at module
      # level: pandas (the annotation tables), pydicom (the synthetic DICOM fixtures) and
      # flask (rendering the result page) were missing, so collection failed on three
      # files and the whole run errored out -- red on every commit from 2026-09-13 to
      # 2026-09-15 without anyone noticing. A test that imports something new means
      # putting it in the right extra.
      #
      # Pillow is in the base install, and its absence once went unnoticed:
      # `inference.render_overlay_png` imports PIL, and `app.server._overlay_data_uri`
      # swallows the failure on purpose so a result page still renders without its
      # image -- so every CI run had been exercising the text-only fallback of the
      # demo, never the annotated slice the demo is for. tests/test_demo_smoke.py
      # asserts the data URI is there; that is what found it.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,data]"

      - name: Lint
        run: ruff check .

      - name: Test
        # Tests import `config` and the `imaging` package from the repo root, and the
        # demo-asset tests shell out to git, so they run from the checkout as-is
        # rather than against an installed copy.
        run: python -m pytest

  # The DCE-MRI flow's decisions (which stage runs, what is stale, what the purge may delete)
  # are tested with Prefect installed. The job above does not install it -- Prefect is the
  # `orchestration` extra -- so its test file is skipped there. A separate job keeps the
  # main one lean.
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `data` because the purge tests import TransformData (pandas, pydicom); torch from
      # the CPU index first, as above, since the base install requires it.
      - name: Install orchestration test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[orchestration,data,dev]"

      # importorskip would turn a missing dependency into a green, empty job.
      - name: Check the tests will not be skipped
        run: python -c "import prefect, pandas, pydicom"

      - name: Test the flows
        run: python -m pytest tests/test_pipeline_dce_mri.py -rs
