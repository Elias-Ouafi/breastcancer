version: 2

models:
  - name: fct_series
    description: One row per series the collection publishes - what the tables say, whether it is on disk, which corpus holds it.
    columns:
      - name: series_uid
        description: Grain. The DICOM SeriesInstanceUID, also the download folder name.
        data_tests: [unique, not_null]
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_patient')", field: patient_id}
      - name: view_position
        data_tests:
          - accepted_values:
              arguments: {values: [cc, mlo]}
      - name: exam_label
        description: 1 for a cancer view in the exam corpus, 0 otherwise, NULL outside the corpus.
        data_tests:
          - accepted_values:
              arguments: {values: [0, 1], quote: false}

  - name: dim_patient
    description: One row per patient, read at their worst view, with download, corpus and score coverage.
    columns:
      - name: patient_id
        description: Grain.
        data_tests: [unique, not_null]
      - name: split
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: [cancer, benign, actionable, normal]}

  - name: collection_coverage
    description: Patients per split and status at each stage - published, on disk, in the exam corpus, scored.

  - name: corpus_summary
    description: One row per preprocessed corpus with its class balance and the run that wrote it.
    columns:
      - name: corpus
        data_tests: [unique]
