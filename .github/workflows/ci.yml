name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Deliberately NOT `pip install -r requirements.txt`. The full dependency set
      # pulls ITK, SimpleITK and the TCIA client -- none of which the test suite
      # exercises, and which would turn a ~1 minute check into several. torch comes
      # from the CPU index: the default wheel ships CUDA and is ~2.5 GB.
      #
      # The list is exactly the third-party modules the suite imports at module level:
      # pandas (the annotation tables), pydicom (the synthetic DICOM fixtures) and
      # flask (rendering the result page) were missing, so collection failed on three
      # files and the whole run errored out -- red on every commit from 2026-09-13 to
      # 2026-09-15 without anyone noticing. Adding a test that imports something new
      # means adding it here too. duckdb is the metadata catalogue's engine
      # (tests/test_catalog.py builds one from miniature tables).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas pydicom flask duckdb pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        # Tests import `config` and the `imaging` package from the repo root, and the
        # demo-asset tests shell out to git, so they run from the checkout as-is
        # rather than against an installed copy.
        run: python -m pytest
