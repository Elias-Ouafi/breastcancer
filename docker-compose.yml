services:
  demo:
    build: .
    image: breastcancer-demo
    # 127.0.0.1 on the left is load-bearing, not decoration. Written as "5000:5000"
    # Docker would bind 0.0.0.0 on the host and publish a research tool -- one that
    # renders medical images and states it is not clinically validated -- to every
    # machine on the network. This form reaches the container from this machine only.
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Set by run_demo.py anyway; stated here so `docker compose config` shows which
      # model is being served without reading the launcher.
      MRI_APP_BACKEND: dce_mri
      BREASTCANCER_LOG_LEVEL: INFO
    # The demo reads a versioned checkpoint and three curated cases, writes uploads to
    # a temp dir and deletes them. It never needs to write to the image.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # S3-compatible object storage for `python -m objectstore` and the publish stage of
  # `python -m pipelines.dbt`. Behind a profile, so `docker compose up` still starts the
  # demo alone:
  #
  #   docker compose --profile storage up -d minio
  #   export BREASTCANCER_S3_ENDPOINT=http://127.0.0.1:9000
  #   export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin
  #   python -m objectstore sync
  #
  # The default credentials are for a local instance only, and the ports are published
  # on the loopback interface for the same reason as the demo's: override
  # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD for anything else. Data lands under
  # data/object_store/, which .gitignore already excludes with the rest of data/.
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - ./data/object_store:/data
    restart: "no"
