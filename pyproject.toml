[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breastcancer"
version = "0.1.0"
description = "Breast cancer detection from DCE-MRI/DBT screening exams"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

# The one place dependencies are declared: no requirements*.txt, so no second list to
# drift. The base install is the demo and nothing else -- torch, Flask, numpy and Pillow
# are the whole third-party surface of run_demo -> app.server -> app.predictor ->
# inference -> imaging.unet (measured 2026-09-20: 17 packages / 153 MB on Windows, against
# 68 / 355 MB for everything). Every other use case is an extra, and `all` is the union.
#
#   pip install -e .                  the demo (then `python run_demo.py`)
#   pip install -e ".[all]"           everything below
#   pip install -e ".[data]"          + read the annotation tables and DICOM
#   pip install -e ".[collect]"       + download from TCIA, decode compressed DICOM
#   pip install -e ".[catalog]"       + build and query the DuckDB catalogue
#   pip install -e ".[orchestration]" + the Prefect flows in pipelines/
#   pip install -e ".[storage]"       + publish to an S3-compatible bucket
#   pip install -e ".[dev]"           + pytest, ruff, moto
#
# torch: the default wheel carries CUDA (~2.5 GB on Linux). For a CPU-only box, or a
# specific CUDA build, install it first from the matching index and pip will find it
# already satisfied:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#
# The Dockerfile reads `dependencies` below with tomllib rather than repeating them.
dependencies = [
    "torch>=2.2",
    "Flask>=3.0",
    "numpy>=1.26,<2",
    "Pillow>=10.2,<11",
]

[project.optional-dependencies]
# What TransformData imports: the annotation tables (pandas, openpyxl for the MRI boxes
# workbook) and DICOM (pydicom). Also all the test suite needs of the data path, so CI
# installs this and not `collect`.
data = [
    "pandas>=2.2,<2.3",
    "pydicom==2.4.3",
    "openpyxl==3.1.2",
]

# Fetching from TCIA and decoding real, compressed DICOM. Kept apart from `data` because
# the TCIA client is what turns a ~1 minute CI check into several, and no test exercises
# it. SimpleITK, itk and itkwidgets were dropped on 2026-09-19 with the legacy
# single-series MRI path that was their only caller; nothing imports them now.
collect = [
    "requests==2.31.0",
    "tcia-utils>=3.3",
    "matplotlib>=3.8.2,<3.9",
    "tqdm==4.66.1",
    "python-gdcm>=3.0",
]

# `python -m catalog build` runs the catalogue's staging, marts and tests with dbt;
# querying an already built catalogue needs only duckdb.
catalog = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.10",
]

# Only `pipelines/` needs this. Kept out of the base install so the demo -- the thing
# people actually run from a clone -- does not pull an orchestrator it never calls.
orchestration = [
    "prefect>=3.0",
]

# `python -m objectstore` and the flow's publish stage: any S3-compatible endpoint
# (MinIO locally, S3 in the cloud).
storage = [
    "boto3>=1.34",
]

# What the tests and the lint gate need; moto fakes S3 for the object-store tests.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "moto[s3]>=5.0",
]

# Every use case at once. A new extra must be added here: a test fails if one is missing.
all = [
    "breastcancer[data,collect,catalog,orchestration,storage,dev]",
]

[tool.setuptools]
# Flat layout: modules live at the repository root rather than under src/.
#
# The list must cover the *transitive* imports, not just the entry points. It was
# missing logging_setup, validation and lineage until 2026-09-15 -- all three are
# imported by modules listed here (inference and TransformData), so an installed copy
# raised ModuleNotFoundError on `import inference` from any directory but the repo
# root. Nothing caught it because every caller here runs from the root.
py-modules = [
    "config",
    "inference",
    "ExtractData",
    "TransformData",
    "run_demo",
    "logging_setup",
    "validation",
    "lineage",
    "http_timeouts",
]

[tool.setuptools.packages.find]
include = ["app*", "imaging*", "pipelines*", "catalog*", "objectstore*"]

[tool.setuptools.package-data]
# The catalogue's dbt project and example queries are read at run time, not imported.
catalog = [
    "dbt/*.yml",
    "dbt/macros/*.sql",
    "dbt/models/*/*.sql",
    "dbt/models/*/*.yml",
    "dbt/tests/*.sql",
    "dbt/tests/*.yml",
    "queries/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests", "imaging"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "models", "__pycache__"]

[tool.ruff.lint]
# E/F are the errors worth failing a build over; I keeps imports ordered. The rest of
# the rulebook is deliberately left off: this is a working research codebase, and a
# gate that flags hundreds of stylistic nits is a gate everyone learns to ignore.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line length: prose-heavy docstrings are the point, not a defect
]

[tool.ruff.lint.per-file-ignores]
# The imaging modules import their siblings twice on purpose, so both
# "python -m imaging.X" and a direct run work; ruff reads the fallback as a redefinition.
"imaging/*.py" = ["F811", "E402"]
