version: 2

# Domain checks that no generic test expresses. Each returns the rows violating it.
# `error` guards a figure that would otherwise be wrong; `warn` flags something the
# pipeline tolerates.
data_tests:
  - name: boxes_match_inventory
    description: Every box joins to an inventoried series on (patient, study, view).
    config: {severity: error}
  - name: corpus_cases_match_inventory
    description: Every preprocessed case is an inventoried series, with the same patient, study and view.
    config: {severity: error}
  - name: exam_corpus_label_matches_labels
    description: In the exam corpus, exam_status is the view's worst flag and label is 1 exactly for cancer.
    config: {severity: error}
  - name: lesion_corpus_label_matches_boxes
    description: In the lesion corpus, label is 1 exactly when the series carries a cancer box.
    config: {severity: error}
  - name: patient_single_split
    description: A patient belongs to one split only; otherwise train and test would share a patient.
    config: {severity: error}
  - name: predictions_patients_in_exam_corpus
    description: Every scored patient has at least one series in the exam corpus.
    config: {severity: error}
  - name: predictions_label_matches_corpus
    description: A scored patient's label is the max of their exam-corpus labels.
    config: {severity: error}
  - name: bronze_series_already_in_silver
    description: A series still in bronze although a silver corpus holds it - a purge pending, or a run with --keep-bronze.
    config: {severity: warn}
  - name: disk_series_in_inventory
    description: Every series folder in bronze is listed by the inventory.
    config: {severity: warn}
  - name: file_paths_have_labels
    description: Every inventoried series has a labels row; one without is skipped by preprocess_dbt_exams.
    config: {severity: warn}
  - name: labels_exactly_one_flag
    description: Each labels row sets exactly one of Normal / Actionable / Benign / Cancer.
    config: {severity: warn}
