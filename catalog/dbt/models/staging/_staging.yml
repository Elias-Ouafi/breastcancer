version: 2

# Each staging model keeps the relation name the catalogue has always exposed
# (stg.dbt_labels, not stg.stg_dbt_labels).
models:
  - name: stg_dbt_labels
    config: {alias: dbt_labels}
    description: One row per (patient, study, view) of the labels table, with the view's worst flag as `status`.
    data_tests:
      - unique:
          arguments:
            column_name: "patient_id || '/' || study_uid || '/' || view"
    columns:
      - name: patient_id
        data_tests: [not_null]
      - name: split
        data_tests:
          - accepted_values:
              arguments: {values: [train, validation, test]}
      - name: status
        description: cancer > benign > actionable > normal; NULL when no flag is set.
        data_tests:
          - accepted_values:
              arguments: {values: [cancer, benign, actionable, normal]}

  - name: stg_dbt_boxes
    config: {alias: dbt_boxes}
    description: One row per annotated lesion box. volume_slices is NULL for the train split, which does not publish it.
    columns:
      - name: lesion_class
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [benign, cancer]}

  - name: stg_dbt_file_paths
    config: {alias: dbt_file_paths}
    description: The series inventory, with series_uid extracted from classic_path.
    columns:
      - name: series_uid
        data_tests: [unique, not_null]
      - name: laterality
        data_tests:
          - accepted_values:
              arguments: {values: [l, r]}

  - name: stg_corpus_cases
    config: {alias: corpus_cases}
    description: One row per case written by a preprocessing run (corpus dbt or dbt_exams).
    data_tests:
      - unique:
          arguments:
            column_name: "corpus || '/' || series_uid"
    columns:
      - name: corpus
        data_tests:
          - accepted_values:
              arguments: {values: [dbt, dbt_exams]}

  - name: stg_corpus_runs
    config: {alias: corpus_runs}
    description: One row per preprocessing run.

  - name: stg_disk_series
    config: {alias: disk_series}
    description: Downloaded series folders.
    columns:
      - name: series_uid
        data_tests: [unique]

  - name: stg_examclf_predictions
    config: {alias: examclf_predictions}
    description: Out-of-fold exam classifier score per patient.
    columns:
      - name: patient_id
        data_tests: [unique, not_null]
