# The catalogue's transformation layer. Run by `python -m catalog build`, which fills
# the `raw` schema first (disk scan and manifest flattening are Python's job), then
# runs `dbt run` and `dbt test` against the same DuckDB file.
name: breastcancer_catalog
version: "1.0.0"
config-version: 2
profile: catalog

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

flags:
  send_anonymous_usage_stats: false

models:
  breastcancer_catalog:
    staging:
      +schema: stg
      +materialized: view
    marts:
      +schema: mart
      +materialized: table

data_tests:
  breastcancer_catalog:
    # Every test keeps its offending rows in qa.<test name>: a failure is investigated
    # with a SELECT, not by re-running the test.
    +store_failures: true
    +schema: qa
